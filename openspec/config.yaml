schema: spec-driven

context: |
  PROYECTO: Demo didáctico de Vertical Slice Architecture (VSA) — Universidad Popular del Cesar 2026.
  Dominio: catálogo e inventario de productos. Monorepo con /apps/backend y /apps/frontend.

  STACK
  - Base de datos: PostgreSQL 16 (contenedor Docker, puerto 5432).
  - Backend: .NET 8 Web API — EF Core, MediatR, FluentValidation (puerto 5000).
  - Frontend: React 18+ con Vite, TypeScript, Tailwind CSS y Lucide Icons (puerto 5173).
  - Orquestación: docker-compose.yml vincula los tres servicios.

  REGLAS ARQUITECTÓNICAS DEL BACKEND (VSA) — no negociables
  1. Estructura por funcionalidad: organizar estrictamente por carpetas de caso de uso
     (Features/CreateProduct, Features/ListProducts, etc.). La carpeta del slice es la
     unidad de organización, NO la capa técnica.
  2. Slices autosuficientes: cada carpeta contiene su DTO de Petición, DTO de Respuesta,
     Validador, Handler y acceso directo a datos. Todo lo que cambia junto vive junto.
  3. Sin capas de abstracción innecesarias: NO crear /Repositories genéricos, NO
     interfaces IService multicapa, NO patrón Unit of Work sobre EF Core. Los handlers
     consultan el DbContext directamente.
  4. Carga inicial automática: seed de PostgreSQL con 10 productos de muestra
     (Nombre, SKU, Categoría, Precio, Stock, Descripción) solo si la BD está vacía.
  5. Sin autenticación ni gestión de usuarios: se omite deliberadamente para mantener el
     código enfocado en enseñar VSA.
  6. Los 5 slices del demo: CreateProduct, GetProductById, ListProducts,
     UpdateProductStock, DeleteProduct.

  REGLAS DEL FRONTEND
  1. Layout responsivo con Sidebar (desplegable en móvil, permanente en escritorio) con
     enlaces a: Catálogo de Productos (inicio), Nuevo Producto, Ajuste de Inventario/Stock.
  2. Vista de catálogo: los 10 productos en cuadrícula/tabla moderna, con filtro por
     categoría y búsqueda en tiempo real (cliente).
  3. Alineación con slices: cada acción del usuario mapea 1:1 con su slice vertical del
     backend vía REST. La organización del código frontend refleja esa correspondencia.

  CRITERIO DIDÁCTICO: ante cualquier duda de diseño, elegir la opción que haga más visible
  el contraste entre VSA y la arquitectura en capas tradicional. Legibilidad sobre
  abstracción. El código es material de clase.

rules:
  proposal:
    - Justificar cada decisión en términos de qué enseña sobre Vertical Slice Architecture.
    - Incluir siempre una sección "Fuera de alcance" (autenticación, multi-tenancy, etc.).
  design:
    - Mostrar el árbol de carpetas completo de cada slice afectado.
    - Señalar explícitamente cualquier duplicación entre slices y por qué se acepta.
  tasks:
    - Agrupar las tareas por slice vertical, nunca por capa técnica.
    - Cada tarea debe ser verificable de forma independiente.
